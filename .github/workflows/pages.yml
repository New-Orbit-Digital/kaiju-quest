# Publishes the game page to GitHub Pages → https://justbost.com/kaiju-quest/
# (justbost.com is the New-Orbit-Digital Pages domain). The page talks to the
# game server on Render. One-time setup: repo Settings → Pages → Source:
# "GitHub Actions".
name: Deploy page to justbost.com
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix client
      - run: npm run build --prefix client
        env:
          VITE_SERVER_URL: wss://kaiju-quest.onrender.com
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

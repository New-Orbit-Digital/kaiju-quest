<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaiju Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%233e9c4a%22/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2230; font-family: system-ui, sans-serif; }
    #game { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 12px; left: 12px; color: #fff; font-size: 14px; line-height: 1.5;
           background: rgba(10, 14, 22, 0.72); padding: 10px 14px; border-radius: 8px; pointer-events: none; min-width: 220px; }
    #hud b { letter-spacing: 0.08em; }
    #hud .role-kaiju { color: #7dff8a; } #hud .role-tank { color: #8fb0ff; }
    #hud .dim { opacity: 0.7; font-size: 12px; }
    #status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #fff;
              background: rgba(10,14,22,.72); padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><b>KAIJU QUEST</b><div id="hud-body">Loading city…</div></div>
  <div id="status">connecting…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
